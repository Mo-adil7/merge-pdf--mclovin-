<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MergePDF — Fast PDF Merger</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" type="module"></script>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--accent:#635bff;--accent2:#5148e5;--soft:#f0efff;--danger:#d92d20}
*{box-sizing:border-box}body.dark{--bg:#0d1117;--panel:#161b22;--text:#f2f4f7;--muted:#98a2b3;--line:#30363d;--soft:#25234b}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:.2s}
header{height:68px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1080px)/2))}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:46px 20px 70px}.hero{text-align:center;margin-bottom:34px}.hero h1{font-size:42px;letter-spacing:-1.5px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}
.drop{display:block;width:100%;border:2px dashed #a7aeb9;border-radius:20px;background:var(--panel);padding:48px 20px;text-align:center;cursor:pointer;transition:.15s}.drop.over,.drop:hover{border-color:var(--accent);background:var(--soft)}.drop input{display:none}.uploadIcon{font-size:38px;margin-bottom:10px}.drop strong{font-size:18px}.drop span{display:block;color:var(--muted);margin-top:6px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;gap:12px}.count{font-weight:700}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.primary:hover{background:var(--accent2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}.thumb{height:210px;background:#eef0f3;display:grid;place-items:center;overflow:hidden}.thumb canvas{max-width:100%;max-height:100%;object-fit:contain}.placeholder{font-size:42px}.info{padding:12px}.filename{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:13px;margin-top:3px}.cardActions{display:flex;gap:7px;margin-top:10px}.small{flex:1;padding:8px 9px}.remove{color:var(--danger)}.dragging{opacity:.45}.empty{text-align:center;color:var(--muted);padding:35px 0}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
@media(max-width:600px){.hero h1{font-size:32px}.drop{padding:36px 14px}.list{grid-template-columns:1fr 1fr}.thumb{height:170px}.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
@media(max-width:380px){.list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">M</div>MergePDF</div><button class="iconbtn" id="theme" title="Toggle theme">🌙</button></header>
<main>
<section class="hero"><h1>Merge PDFs in seconds</h1><p>Combine, reorder and download your PDFs. Everything happens in your browser.</p></section>
<label class="drop" id="drop"><input id="picker" type="file" accept="application/pdf" multiple><div class="uploadIcon">📄</div><strong>Drop your PDF files here</strong><span>or click to browse · PDF files only</span></label>
<div class="toolbar"><div class="count" id="count">No files selected</div><div class="actions"><button class="btn" id="clear" disabled>Clear all</button><button class="btn primary" id="merge" disabled>Merge & download</button></div></div>
<section class="list" id="list"><div class="empty" id="empty">Your PDF files will appear here.</div></section>
<div class="footer">🔒 Files stay on your device. No account or upload required.</div>
</main>
<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.mjs";
const {PDFDocument}=window.PDFLib;
const picker=document.getElementById("picker"),drop=document.getElementById("drop"),list=document.getElementById("list"),count=document.getElementById("count"),merge=document.getElementById("merge"),clear=document.getElementById("clear"),theme=document.getElementById("theme");
let files=[],dragIndex=null;
const size=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
function render(){list.innerHTML=""; if(!files.length){list.innerHTML='<div class="empty">Your PDF files will appear here.</div>'} files.forEach((f,i)=>{const c=document.createElement("article");c.className="card";c.draggable=true;c.dataset.i=i;c.innerHTML='<div class="thumb"><div class="placeholder">📄</div></div><div class="info"><div class="filename" title="'+esc(f.name)+'">'+esc(f.name)+'</div><div class="meta">'+size(f.size)+'</div><div class="cardActions"><button class="btn small up" '+(i?'':'disabled')+'>↑</button><button class="btn small down" '+(i===files.length-1?'disabled':'')+'>↓</button><button class="btn small remove">Remove</button></div></div>';list.appendChild(c);preview(f,c.querySelector(".thumb"));c.querySelector(".remove").onclick=()=>{files.splice(i,1);render()};c.querySelector(".up").onclick=()=>move(i,i-1);c.querySelector(".down").onclick=()=>move(i,i+1);c.ondragstart=()=>dragIndex=i;c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();if(dragIndex!==null&&dragIndex!==i){const x=files.splice(dragIndex,1)[0];files.splice(i,0,x);render()}dragIndex=null};});count.textContent=files.length?files.length+" PDF"+(files.length>1?"s":"")+" selected":"No files selected";merge.disabled=files.length<2;clear.disabled=!files.length}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function move(a,b){if(b<0||b>=files.length)return;[files[a],files[b]]=[files[b],files[a]];render()}
async function preview(f,box){try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;const page=await pdf.getPage(1);const v=page.getViewport({scale:1});const scale=Math.min(190/v.width,190/v.height);const vp=page.getViewport({scale});const can=document.createElement("canvas");can.width=vp.width;can.height=vp.height;await page.render({canvasContext:can.getContext("2d"),viewport:vp}).promise;box.innerHTML="";box.appendChild(can)}catch(e){}}
function add(fs){const incoming=[...fs].filter(f=>f.type==="application/pdf");files.push(...incoming);render()}
picker.onchange=e=>{add(e.target.files);picker.value=""};
["dragenter","dragover"].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>add(e.dataTransfer.files));clear.onclick=()=>{files=[];render()};
theme.onclick=()=>{document.body.classList.toggle("dark");theme.textContent=document.body.classList.contains("dark")?"☀️":"🌙"};
merge.onclick=async()=>{merge.disabled=true;merge.textContent="Merging…";try{const out=await PDFDocument.create();for(const f of files){const src=await PDFDocument.load(await f.arrayBuffer());(await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p))}const bytes=await out.save();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download="merged.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}catch(e){alert("Unable to merge. One of the PDFs may be encrypted or invalid.")}merge.textContent="Merge & download";merge.disabled=files.length<2};
render();
</script>
</body></html>
